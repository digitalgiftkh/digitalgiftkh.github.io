<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Digital Gift KH Platform</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (https://digitalgiftkh.github.io)
      // Redirects /love-letter/id and /love-box/id to /?p=/love-letter/id so index.html can restore the path
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
